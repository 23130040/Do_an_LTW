<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="stylesheet/StyleTrangDangKy.css">
</head>
<body>
    <main>
        <div id="signup_container">
            <div class="signup_title">
                <img src="image/logo_cmeat.png" class="signup_logo" alt="">
                <h1 class="signup_title_txt">ĐĂNG KÝ</h1>
            </div>
            <div class="signup_form">
                <form class="form_content">
                    <div class ="form_input name">
                        <input type="text" id="username" class="input_field username_input" placeholder="Nhập họ và tên" required>
                    </div>
                    <div class ="form_input email">
                        <input type="text" id="email" class="input_field email_input" placeholder="Nhập email" required>
                    </div>
                    <div class ="form_input password">
                        <input type="password" id="password" class="input_field password_input" placeholder="Tạo mật khẩu" required>
                    </div>
                    <div class ="form_input confirm_password">
                        <input type="password" id="confirm_password" class="input_field confirm_password_input" placeholder="Nhập lại mật khẩu" required>
                    </div>
                    <div class ="form_input submit">
                        <input type="submit" id="submit" class="input_submit" value="ĐĂNG KÝ">
                    </div>
                </form>
                <div class="login_link">
                    <span class="login txt">Bạn đã có tài khoản?</span>
                    <a href="TrangDangNhap.html" class="login link">Đăng nhập ngay</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
