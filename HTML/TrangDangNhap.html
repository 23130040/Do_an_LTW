<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clean Meat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../CSS/StyleTrangDangNhap.css">
    <link rel="stylesheet" href="../CSS/all.min.css">

</head>
<body>
<div id="container">
    <div id="wrapper">
        <form id="login-form">
            <img src="../images/logoCleanmeat.png" alt="logo">
            <h1 class="heading_title">ĐĂNG NHẬP</h1>
            <div class="block user_name">
                <i class="fa-regular fa-user"></i>
                <input type="text" class="form_input" name='email' placeholder="Nhập email" required>
            </div>
            <div class="block password">
                <i class="fa-solid fa-lock"></i>
                <input type="password" class="form_input" name='password' placeholder="Nhập mật khẩu" required>
            </div>
            <div class="block forgot_password">
                <a href="#" class="link forgot" id="open-forgot-modal-btn">Quên mật khẩu?</a>
            </div>
            <div class="block submit">
                <a href="#" class="home link form_submit" id="login-submit-btn">ĐĂNG NHẬP</a>
            </div>
            <div class="separator-container">
                <div class="separator-line"></div>
                <span class="separator-text">HOẶC</span>
                <div class="separator-line"></div>
            </div>
            <div class="block social-login">
                <a href="#" class="link google-submit">
                    <i class="fab fa-google"></i>
                    TIẾP TỤC VỚI GOOGLE
                </a>
            </div>
            <div class="block sign_up">
                <span class="txt">Bạn chưa có tài khoản?</span>
                <a href="TrangDangKy.html" class="link sign_up">Đăng ký ngay</a>
            </div>
        </form>
    </div>
</div>
<div id="forgotPasswordModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeForgotModal">&times;</span>

        <form id="forgot-password-form">
            <h1 class="heading_title">QUÊN MẬT KHẨU</h1>
            <p class="txt">Nhập email và mật khẩu mới để đặt lại</p>

            <div class="block email_reset">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" class="form_input" name='reset_email' placeholder="Nhập email của bạn" required>
            </div>

            <div class="block password_new">
                <i class="fa-solid fa-key"></i>
                <input type="password" class="form_input" name='new_password' placeholder="Tạo mật khẩu mới" required>
            </div>

            <div class="block submit">
                <a href="#" class="home link form_submit" id="reset-password-btn">ĐẶT LẠI MẬT KHẨU</a>
            </div>
        </form>
    </div>
</div>
<script src="../JavaScript/dataUser.js"></script>
</body>
</html>
