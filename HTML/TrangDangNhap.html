<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="../CSS/StyleTrangDangNhap.css">
    <link rel="stylesheet" href="../CSS/all.min.css">
</head>
<body>
    <div id="wrapper">
        <form>
            <img src="../images/logo_cmeat.png" alt="logo">
            <h1 class="heading_title">ĐĂNG NHẬP</h1>
            <div class="block user_name">
                <i class="fa-regular fa-user"></i>
                <input type="text" class="form_input" placeholder="Tên đăng nhập">
            </div>
            <div class="block password">
                <i class="fa-solid fa-lock"></i>
                <input type="password" class="form_input" placeholder="Mật khẩu">
            </div>
            <div class="block forgot_password">
                <a href="#" class="link forgot">Quên mật khẩu?</a>
            </div>
            <div class="block submit">
                <a href="trang_chu_da_login.html" class="home link form_submit">ĐĂNG NHẬP</a>
                <!--<input type="submit" class="form_submit" value="ĐĂNG NHẬP">-->
            </div>
            <div class="block sign_up">
                <span class="txt">Bạn chưa có tài khoản?</span>
                <a href="TrangDangKy.html" class="link sign_up">Đăng ký ngay</a>
            </div>
        </form>
    </div>
</body>
</html>
